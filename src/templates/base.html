<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}doit{% endblock %}</title>
  <style>
    :root {
      --bg:          #ffffff;
      --bg2:         #f5f5f7;
      --bg3:         #ebebed;
      --text:        #1c1c1e;
      --text2:       #6c6c70;
      --accent:      #007aff;
      --accent-dark: #0051a8;
      --border:      #d1d1d6;
      --danger:      #ff3b30;
      --success:     #34c759;
      --nav-h:       56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top:    env(safe-area-inset-top, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:     #000000;
        --bg2:    #1c1c1e;
        --bg3:    #2c2c2e;
        --text:   #f2f2f7;
        --text2:  #8e8e93;
        --accent: #0a84ff;
        --border: #38383a;
      }
    }
    :root[data-theme="dark"] {
      --bg:     #000000;
      --bg2:    #1c1c1e;
      --bg3:    #2c2c2e;
      --text:   #f2f2f7;
      --text2:  #8e8e93;
      --accent: #0a84ff;
      --border: #38383a;
    }
    :root[data-fontsize="small"]  { font-size: 13px; }
    :root[data-fontsize="medium"] { font-size: 15px; }
    :root[data-fontsize="large"]  { font-size: 18px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
    }
    .page {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
    }
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 200;
    }
    .nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding-bottom: var(--safe-bottom);
      text-decoration: none;
      color: var(--text2);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      -webkit-tap-highlight-color: transparent;
    }
    .nav a.active { color: var(--accent); }
    .nav a svg { width: 24px; height: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--bg3); color: var(--text); }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-sm      { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-top    { background: #ff3b3022; color: #ff3b30; }
    .badge-high   { background: #ff950022; color: #ff9500; }
    .badge-medium { background: #007aff22; color: var(--accent); }
    .badge-low    { background: var(--bg3); color: var(--text2); }
    .text2   { color: var(--text2); }
    .text-sm { font-size: 13px; }
    .section-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 18px 16px 6px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <nav class="nav">
    <a href="/tasks" {% if active == 'tasks' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      Tasks
    </a>
    <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </a>
    {% if current_user and current_user.admin %}
    <a href="/admin" {% if active == 'admin' %}class="active"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
      </svg>
      Admin
    </a>
    {% endif %}
    <form method="post" action="/auth/logout" style="flex:1;display:flex;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <button type="submit" style="flex:1;display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:3px;padding-bottom:var(--safe-bottom);
              background:none;border:none;cursor:pointer;color:var(--text2);
              font-size:10px;font-weight:500;letter-spacing:.02em;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign Out
      </button>
    </form>
  </nav>

  <script>
  (function() {
    // Server-side prefs injected at render time take priority over localStorage
    var serverTheme    = {{ (current_user.prefs.theme    if current_user and current_user.prefs else None) | tojson }};
    var serverFontSize = {{ (current_user.prefs.font_size if current_user and current_user.prefs else None) | tojson }};

    function applyTheme(t) {
      if (t === 'dark')       document.documentElement.setAttribute('data-theme', 'dark');
      else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else                    document.documentElement.removeAttribute('data-theme');
    }
    applyTheme(serverTheme || localStorage.getItem('theme') || 'system');

    function applyFontSize(s) {
      document.documentElement.setAttribute('data-fontsize', s || 'medium');
    }
    applyFontSize(serverFontSize || localStorage.getItem('fontSize') || 'medium');
  })();
  </script>
</body>
</html>
