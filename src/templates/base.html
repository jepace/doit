<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>{% block title %}doit{% endblock %}</title>
  <style>
    :root {
      --bg:          #ffffff;
      --bg2:         #f5f5f7;
      --bg3:         #ebebed;
      --text:        #1c1c1e;
      --text2:       #6c6c70;
      --accent:      #007aff;
      --accent-dark: #0051a8;
      --border:      #d1d1d6;
      --danger:      #ff3b30;
      --success:     #34c759;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top:    env(safe-area-inset-top, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:     #000000;
        --bg2:    #1c1c1e;
        --bg3:    #2c2c2e;
        --text:   #f2f2f7;
        --text2:  #8e8e93;
        --accent: #0a84ff;
        --border: #38383a;
      }
    }
    :root[data-theme="dark"] {
      --bg:     #000000;
      --bg2:    #1c1c1e;
      --bg3:    #2c2c2e;
      --text:   #f2f2f7;
      --text2:  #8e8e93;
      --accent: #0a84ff;
      --border: #38383a;
    }
    :root[data-fontsize="small"]  { font-size: 13px; }
    :root[data-fontsize="medium"] { font-size: 15px; }
    :root[data-fontsize="large"]  { font-size: 18px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
    }
    .page {
      flex: 1;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }
    /* ── Top-right menu ──────────────────────────────── */
    .top-menu {
      position: relative;
      display: inline-block;
    }
    .top-menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .top-menu-btn:hover, .top-menu-btn.open { background: var(--bg3); color: var(--text); }
    .top-menu-btn svg { width: 22px; height: 22px; }
    .top-menu-drop {
      display: none;
      position: absolute;
      right: 0; top: calc(100% + 4px);
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
      z-index: 300;
      min-width: 160px;
      overflow: hidden;
    }
    .top-menu-drop.open { display: block; }
    .top-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .top-menu-item:last-child { border-bottom: none; }
    .top-menu-item:hover, .top-menu-item:active { background: var(--bg3); }
    .top-menu-item.active { color: var(--accent); }
    .top-menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .top-menu-item.danger { color: var(--danger); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--bg3); color: var(--text); }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-sm      { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-top    { background: #ff3b3022; color: #ff3b30; }
    .badge-high   { background: #ff950022; color: #ff9500; }
    .badge-medium { background: #007aff22; color: var(--accent); }
    .badge-low    { background: var(--bg3); color: var(--text2); }
    .text2   { color: var(--text2); }
    .text-sm { font-size: 13px; }
    .section-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 18px 16px 6px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  {% if current_user %}
  <!-- Top-right menu (Settings / Admin / Sign Out) -->
  <div class="top-menu" id="top-menu" style="position:fixed;top:calc(var(--safe-top) + 8px);right:12px;z-index:300;">
    <button class="top-menu-btn" id="top-menu-btn" aria-label="Menu" onclick="toggleTopMenu(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="top-menu-drop" id="top-menu-drop">
      <a href="/settings" class="top-menu-item {% if active == 'settings' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
      {% if current_user.admin %}
      <a href="/admin" class="top-menu-item {% if active == 'admin' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
        </svg>
        Admin
      </a>
      {% endif %}
      <form method="post" action="/auth/logout" style="display:contents;">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="top-menu-item danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </form>
    </div>
  </div>

  <script>
  function toggleTopMenu(e) {
    e.stopPropagation();
    const btn  = document.getElementById('top-menu-btn');
    const drop = document.getElementById('top-menu-drop');
    const open = drop.classList.toggle('open');
    btn.classList.toggle('open', open);
  }
  document.addEventListener('click', function() {
    document.getElementById('top-menu-drop')?.classList.remove('open');
    document.getElementById('top-menu-btn')?.classList.remove('open');
  });
  document.getElementById('top-menu-drop')?.addEventListener('click', e => e.stopPropagation());
  </script>
  {% endif %}

  <script>
  (function() {
    var serverTheme    = {{ (current_user.prefs.theme    if current_user and current_user.prefs else None) | tojson }};
    var serverFontSize = {{ (current_user.prefs.font_size if current_user and current_user.prefs else None) | tojson }};

    function applyTheme(t) {
      if (t === 'dark')       document.documentElement.setAttribute('data-theme', 'dark');
      else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else                    document.documentElement.removeAttribute('data-theme');
    }
    applyTheme(serverTheme || localStorage.getItem('theme') || 'system');

    function applyFontSize(s) {
      document.documentElement.setAttribute('data-fontsize', s || 'medium');
    }
    applyFontSize(serverFontSize || localStorage.getItem('fontSize') || 'medium');
  })();
  </script>
</body>
</html>
