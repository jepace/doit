<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do It! — {{ today }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      color: #000;
      background: #fff;
      padding: 28px 32px;
    }

    .screen-only {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #ddd;
    }
    .btn-print {
      background: #007aff; color: #fff; border: none;
      padding: 9px 20px; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    .btn-back { color: #007aff; text-decoration: none; font-size: 14px; }

    .print-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }
    .print-header h1 { font-size: 18px; font-weight: 700; }
    .print-header .date { font-size: 12px; color: #555; }

    /* One row per task: [checkbox] [name……underline……] [ctx] */
    .task-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      height: 28px;           /* fixed row height — one line */
      overflow: hidden;
    }

    .check-box {
      flex-shrink: 0;
      width: 14px; height: 14px;
      border: 1px solid #000;
      border-radius: 2px;
      margin-bottom: 2px;     /* optical alignment with baseline */
    }

    .task-name {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 13px;
      line-height: 28px;
    }

    /* Underline fills remaining space */
    .task-line {
      flex: 1;
      border-bottom: 1px solid #000;
      min-width: 20px;
      height: 21px;           /* sits on the text baseline */
    }

    .task-ctx {
      flex-shrink: 0;
      font-size: 11px;
      white-space: nowrap;
      color: #000;
      line-height: 28px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px 0;
      font-size: 14px;
    }

    @media print {
      .screen-only { display: none !important; }
      body { padding: 0; }
      @page { margin: 1.5cm; size: letter portrait; }
    }
  </style>
</head>
<body>

  <div class="screen-only">
    <a href="/" class="btn-back">‹ Back</a>
    <span style="font-size:14px;color:#555;">{{ today }}</span>
    <button class="btn-print" onclick="window.print()">Save as PDF / Print</button>
  </div>

  <div class="print-header">
    <h1>Do It!</h1>
    <span class="date">{{ today }}</span>
  </div>

  {% if tasks %}
    {% for task in tasks %}
    <div class="task-row">
      <div class="check-box"></div>
      <span class="task-name">{{ task.description }}</span>
      <div class="task-line"></div>
      {% if task.context %}<span class="task-ctx">{{ task.context }}</span>{% endif %}
    </div>
    {% endfor %}
  {% else %}
  <div class="empty">Nothing due today or overdue.</div>
  {% endif %}

</body>
</html>
