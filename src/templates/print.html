<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do It! — {{ today }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      color: #000;
      background: #f0f0f0;
    }
    .page-body {
      background: #fff;
      width: 8.5in;
      min-height: 11in;
      margin: 24px auto;
      padding: 2cm 2.2cm;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }

    .screen-only {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #ddd;
    }
    .btn-print {
      background: #007aff; color: #fff; border: none;
      padding: 9px 20px; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    .btn-back { color: #007aff; text-decoration: none; font-size: 14px; }

    .print-header { margin-bottom: 16px; flex-shrink: 0; }
    .print-header h1 { font-size: 18px; font-weight: 700; }
    .print-header h1 .date { font-weight: 400; }

    /* One row per task: [checkbox] [name……underline……] [ctx] */
    .task-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      height: 28px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .check-box {
      flex-shrink: 0;
      width: 14px; height: 14px;
      border: 1px solid #000;
      border-radius: 2px;
      margin-bottom: 2px;
    }

    .task-name {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 13px;
      line-height: 28px;
    }

    .task-line {
      flex: 1;
      border-bottom: 1px solid #000;
      min-width: 20px;
      height: 21px;
    }

    /* Blank filler rows — lighter line */
    .blank-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      height: 28px;
      flex-shrink: 0;
    }
    .blank-row .task-line { border-bottom-color: #bbb; }

    .task-ctx {
      flex-shrink: 0;
      font-size: 11px;
      white-space: nowrap;
      color: #000;
      line-height: 28px;
    }

    .page-running-header { display: none; }
    @media print {
      .screen-only { display: none !important; }
      body { background: #fff; }
      .page-body { margin: 0; padding: 0; box-shadow: none; width: auto; min-height: 0; }
      @page { margin: 2cm 2.2cm; size: 8.5in 11in portrait; }
      .page-running-header {
        display: block;
        position: fixed;
        top: 0; left: 0; right: 0;
        font-size: 13px; font-weight: 700;
        padding-bottom: 6px;
        border-bottom: 1px solid #bbb;
      }
    }
  </style>
</head>
<body>

  <div class="screen-only">
    <a href="/" class="btn-back">‹ Back</a>
    <span style="font-size:14px;color:#555;">{{ today }}</span>
    <button class="btn-print" onclick="window.print()">Save as PDF / Print</button>
  </div>

  <div class="page-running-header">Do It!</div>

  <div class="page-body">
    <div class="print-header">
      <h1>Do It! <span class="date">({{ today }})</span></h1>
    </div>

    {% for task in tasks %}
    <div class="task-row">
      <div class="check-box"></div>
      <span class="task-name">{{ task.description }}</span>
      <div class="task-line"></div>
      {% if task.context %}<span class="task-ctx">{{ task.context }}</span>{% endif %}
    </div>
    {% endfor %}

    {% for _ in range(blank_rows) %}
    <div class="blank-row">
      <div class="check-box"></div>
      <div class="task-line"></div>
    </div>
    {% endfor %}

  </div><!-- /.page-body -->

</body>
</html>
