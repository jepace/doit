<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — doit</title>
  <style>
    :root { --bg:#fff;--bg2:#f5f5f7;--text:#1c1c1e;--text2:#6c6c70;--accent:#007aff;--border:#d1d1d6;--danger:#ff3b30; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#000;--bg2:#1c1c1e;--text:#f2f2f7;--text2:#8e8e93;--accent:#0a84ff;--border:#38383a; }
    }
    *,*::before,*::after { box-sizing:border-box;margin:0;padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg);color:var(--text);
           display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px; }
    .card { background:var(--bg2);border-radius:16px;padding:32px 28px;width:100%;max-width:360px; }
    h1 { font-size:24px;font-weight:700;margin-bottom:16px; }
    p { color:var(--text2);margin-bottom:16px;line-height:1.5; }
    label { display:block;font-size:13px;font-weight:600;color:var(--text2);
            text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px; }
    input { width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
            border-radius:10px;padding:12px 14px;font-size:16px;margin-bottom:16px;
            font-family:inherit;outline:none;-webkit-appearance:none; }
    input:focus { border-color:var(--accent); }
    .btn { width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
           padding:13px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px; }
    .success { background:#34c75922;color:#34c759;border-radius:8px;
               padding:10px 14px;font-size:14px;margin-bottom:16px; }
    .links { margin-top:16px; font-size:14px; color:var(--text2); text-align:center; }
    .links a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    {% if success %}
      <div class="success">If that email is registered, we've sent a reset link.</div>
      <div class="links"><a href="/auth/login">Back to sign in</a></div>
    {% else %}
      <p>Enter your email and we'll send you a reset link.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autofocus required>
        <button type="submit" class="btn">Send reset link</button>
      </form>
      <div class="links"><a href="/auth/login">Back to sign in</a></div>
    {% endif %}
  </div>
</body>
</html>
