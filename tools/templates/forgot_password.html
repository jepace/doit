<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — doit</title>
  <style>
    :root { --bg:#fff;--bg2:#f5f5f7;--text:#1c1c1e;--text2:#6c6c70;--accent:#007aff;--border:#d1d1d6;--danger:#ff3b30;--success:#34c759; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#000;--bg2:#1c1c1e;--text:#f2f2f7;--text2:#8e8e93;--accent:#0a84ff;--border:#38383a; }
    }
    *,*::before,*::after { box-sizing:border-box;margin:0;padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg);color:var(--text);
           display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px; }
    .card { background:var(--bg2);border-radius:16px;padding:32px 28px;width:100%;max-width:380px; }
    h1 { font-size:24px;font-weight:700;margin-bottom:10px; }
    .subtitle { color:var(--text2);font-size:14px;margin-bottom:24px;line-height:1.5; }
    label { display:block;font-size:13px;font-weight:600;color:var(--text2);
            text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px; }
    input[type="email"] {
      width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
      border-radius:10px;padding:12px 14px;font-size:16px;margin-bottom:16px;
      font-family:inherit;outline:none;-webkit-appearance:none; }
    input:focus { border-color:var(--accent); }
    .btn { width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
           padding:13px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px; }
    .success { background:#34c75922;color:#1a7a36;border-radius:8px;
               padding:14px;font-size:14px;margin-bottom:16px;line-height:1.5; }
    .links { margin-top:16px;text-align:center;font-size:14px;color:var(--text2); }
    .links a { color:var(--accent);text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    {% if submitted %}
      <div class="success">
        If that email address is registered, you'll receive a password reset link shortly.
        Check your inbox (and spam folder).
      </div>
    {% else %}
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autofocus required>
        <button type="submit" class="btn">Send Reset Link</button>
      </form>
    {% endif %}
    <div class="links">
      <a href="/auth/login">Back to Sign In</a>
    </div>
  </div>
</body>
</html>
