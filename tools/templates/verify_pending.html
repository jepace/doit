<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Email — doit</title>
  <style>
    :root { --bg:#fff;--bg2:#f5f5f7;--text:#1c1c1e;--text2:#6c6c70;--accent:#007aff;--border:#d1d1d6;--danger:#ff3b30; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#000;--bg2:#1c1c1e;--text:#f2f2f7;--text2:#8e8e93;--accent:#0a84ff;--border:#38383a; }
    }
    *,*::before,*::after { box-sizing:border-box;margin:0;padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg);color:var(--text);
           display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px; }
    .card { background:var(--bg2);border-radius:16px;padding:32px 28px;width:100%;max-width:400px;text-align:center; }
    h1 { font-size:24px;font-weight:700;margin-bottom:16px; }
    p { color:var(--text2);margin-bottom:16px;line-height:1.5; }
    .error { background:#ff3b3022;color:var(--danger);border-radius:8px;
             padding:10px 14px;font-size:14px;margin-bottom:16px; }
    form { margin-top:20px; }
    input { width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
            border-radius:10px;padding:12px 14px;font-size:16px;margin-bottom:12px;
            font-family:inherit;outline:none;-webkit-appearance:none; }
    input:focus { border-color:var(--accent); }
    .btn { width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
           padding:13px;font-size:16px;font-weight:600;cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Check your email</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <p>We sent a verification link to your email address. Click it to activate your account.</p>
    <p>Didn't get it? Enter your email below to resend.</p>
    <form method="post" action="/auth/resend-verify">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="email" name="email" placeholder="your@email.com" required>
      <button type="submit" class="btn">Resend verification email</button>
    </form>
  </div>
</body>
</html>
